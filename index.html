<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家伴到｜异地家属采购配送</title>
<style>
:root{--ink:#21332d;--muted:#738078;--green:#34735a;--deep:#244c3d;--pale:#eaf2eb;--paper:#f6f7f3;--line:#e6eae4;--orange:#b86b42;--white:#fff;--shadow:0 12px 36px #1f39240b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1120px;margin:auto;padding:24px 24px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:11px;align-items:center;font-size:20px;font-weight:750}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.avatar{width:32px;height:32px;border-radius:50%;background:#dbe9dd;display:grid;place-items:center;color:var(--green);font-weight:700}.hero{background:#eaf1e9;border-radius:26px;padding:32px 38px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.hero h1{font-size:clamp(28px,4vw,40px);line-height:1.2;margin:8px 0 11px}.hero p{color:#5c6d62;margin:0;max-width:670px}.eyebrow{font-size:12px;color:var(--green);font-weight:750;letter-spacing:1px}.heroicon{font-size:62px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:28px 0 15px}.toolbar h2{font-size:21px;margin:0}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--muted);background:#fff;cursor:pointer;font-size:13px}.filter.active{background:var(--deep);color:#fff;border-color:var(--deep)}.btn{border:0;border-radius:11px;background:var(--green);color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.95)}.btn.ghost{background:var(--pale);color:var(--green)}.btn.orange{background:#b8663f}.btn.small{font-size:13px;padding:8px 12px}.orderlist{display:grid;gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow)}.orderhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.orderid{font-size:13px;color:var(--muted)}.order h3{margin:5px 0 0;font-size:18px}.status{border-radius:20px;padding:6px 11px;background:#edf2ec;color:var(--green);font-size:12px;white-space:nowrap}.status.pending{background:#fff0e7;color:#a5532e}.status.done{background:#e9f1ed;color:#34735a}.ordergrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:18px 0}.info{background:#fafbf8;border:1px solid #eff1ec;border-radius:13px;padding:13px 15px}.info small{color:var(--muted);display:block;margin-bottom:5px}.info strong{font-weight:650}.items{color:#4f6057;font-size:14px;line-height:1.8}.meta{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.meta b{color:var(--ink);font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #f0f1ed;padding-top:14px}.timeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#849087;font-size:11px;margin:5px 0 14px}.timeline .done{color:var(--green);font-weight:700}.timeline i{width:24px;height:1px;background:#d9dfd8}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;text-align:center;padding:42px;color:var(--muted)}.empty span{font-size:34px;display:block;margin-bottom:8px}.note{text-align:center;font-size:12px;color:#8a958e;margin-top:24px}.modal{position:fixed;inset:0;z-index:3;background:#17231c80;display:none;place-items:center;padding:16px}.modal.show{display:grid}.dialog{background:#fff;padding:24px;border-radius:20px;width:min(100%,560px);max-height:92vh;overflow:auto}.dialog h2{margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#66746c}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;background:white}.field input:focus,.field textarea:focus{border-color:#82a38d}.field textarea{resize:vertical;min-height:65px}.productrow{display:grid;grid-template-columns:1fr 75px 80px 34px;gap:7px;margin:7px 0}.productrow input{min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px}.remove{border:0;background:#f7eeea;color:#a5532e;border-radius:9px;cursor:pointer}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.workflow{display:grid;gap:12px}.wfstep{border:1px solid var(--line);border-radius:13px;padding:14px}.wfstep h3{font-size:15px;margin:0 0 9px}.wfstep .field{margin:8px 0}.wfstep input[type=file]{font-size:12px}.help{font-size:12px;color:var(--muted)}@media(max-width:650px){.wrap{padding:16px 13px 40px}.hero{padding:25px}.heroicon{display:none}.ordergrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.productrow{grid-template-columns:1fr 58px 67px 31px}.toolbar{align-items:flex-start;gap:12px;flex-direction:column}.topright .role{display:none}.order{padding:16px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">家</div><div>家伴到 <span style="font-weight:400;color:#738078">Family Errand</span></div></div><div class="topright"><span class="role">异地家属 · 演示平台</span><div class="avatar">家</div></div></header>
<section class="hero"><div><div class="eyebrow">让每一份牵挂，都有人接单</div><h1>家里需要什么，<br>下单后有人采购配送。</h1><p>填写家属和收货信息、列出采购清单；接单人采购后上传票据，再提交导航距离并完成配送确认。</p></div><div class="heroicon">🧺</div></section>
<div class="toolbar"><h2>订单管理</h2><button class="btn" id="newOrder">＋ 创建采购订单</button></div>
<div class="filters" id="filters"><button class="filter active" data-filter="all">全部订单</button><button class="filter" data-filter="pending">待接单</button><button class="filter" data-filter="accepted">采购中</button><button class="filter" data-filter="delivery">配送中</button><button class="filter" data-filter="finished">已完成</button></div>
<section id="orders" class="orderlist" style="margin-top:14px"></section>
<div class="note">演示原型 · 订单与附件信息保存在当前浏览器 · 尚未连接真实支付、地图、通知或云端服务</div></main>
<div class="modal" id="createModal"><form id="createForm" class="dialog"><h2>创建采购订单</h2><p class="sub">填写收货家属信息和需要采购的商品。</p><div class="fields"><div class="field"><label>家属姓名</label><input name="person" required placeholder="收货人姓名"></div><div class="field"><label>联系电话</label><input name="phone" type="tel" required placeholder="收货人电话"></div><div class="field full"><label>家庭住址</label><input name="address" required placeholder="省市区、街道和门牌号"></div><div class="field full"><label>采购商品明细</label><div id="products"></div><button type="button" class="btn ghost small" id="addProduct">＋ 添加商品</button></div><div class="field full"><label>备注（选填）</label><textarea name="note" placeholder="品牌偏好、替代选择、送达说明等"></textarea></div></div><div class="modalactions"><button type="button" class="btn ghost" data-close>取消</button><button class="btn">提交订单</button></div></form></div>
<div class="modal" id="stepModal"><form id="stepForm" class="dialog"><h2 id="stepTitle">订单处理</h2><p class="sub" id="stepSub"></p><div id="stepFields" class="workflow"></div><div class="modalactions"><button type="button" class="btn ghost" data-close>取消</button><button class="btn" id="stepSubmit">确认提交</button></div></form></div>
<script>
const STORE='family-errand-orders-v1';const demo=[{id:'GTG-26001',person:'王阿姨',phone:'138****2681',address:'杭州市西湖区文三路 88 号',products:[{name:'大米',qty:1,unit:'袋'},{name:'食用油',qty:1,unit:'桶'},{name:'抽纸',qty:2,unit:'提'}],note:'大米优先选东北米',status:'pending',created:Date.now()-3600000,events:[]},{id:'GTG-26002',person:'李叔叔',phone:'139****7310',address:'杭州市拱墅区湖墅南路 126 号',products:[{name:'牛奶',qty:2,unit:'箱'},{name:'洗衣液',qty:1,unit:'瓶'}],note:'',status:'delivery',created:Date.now()-7200000,receipt:'超市小票：牛奶 2 箱、洗衣液 1 瓶，共计 ¥168.00',receiptFile:'receipt-demo.jpg',distance:'6.8',navFile:'route-demo.png',events:[{label:'已接单',time:Date.now()-6500000},{label:'已上传票据明细',time:Date.now()-5100000},{label:'开始配送 · 导航 6.8 km',time:Date.now()-3000000}]}];let orders;try{orders=JSON.parse(localStorage.getItem(STORE))||demo}catch{orders=demo}let currentFilter='all',activeId=null,actionType=null;
const statuses={pending:'待接单',accepted:'采购中',delivery:'配送中',arrived:'待确认送达',finished:'已完成'};const milestones=['提交订单','接单','票据明细','开始配送','确认送达','结束订单'];
function save(){localStorage.setItem(STORE,JSON.stringify(orders));render()}function fmt(t){return new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stage(s){return {pending:0,accepted:1,delivery:3,arrived:4,finished:5}[s]??0}
function render(){let view=orders.filter(o=>currentFilter==='all'||(currentFilter==='accepted'&&o.status==='accepted')||(currentFilter==='delivery'&&['delivery','arrived'].includes(o.status))||o.status===currentFilter);document.querySelector('#orders').innerHTML=view.length?view.map(o=>card(o)).join(''):'<div class="empty"><span>📦</span>还没有这个状态的订单</div>'}
function card(o){let cls=o.status==='pending'?'pending':o.status==='finished'?'done':'';let items=o.products.map(p=>`${esc(p.name)} × ${esc(p.qty)} ${esc(p.unit)}`).join('、');let actions='';if(o.status==='pending')actions=`<button class="btn small" onclick="accept('${o.id}')">接单</button>`;if(o.status==='accepted')actions=`<button class="btn small" onclick="openStep('${o.id}','receipt')">上传票据明细</button>`;if(o.status==='delivery')actions=`<button class="btn small orange" onclick="openStep('${o.id}','arrived')">确认已送达</button>`;if(o.status==='arrived')actions=`<button class="btn small" onclick="finish('${o.id}')">结束订单</button>`;let timeline=milestones.map((x,i)=>`${i?'<i></i>':''}<span class="${i<=stage(o.status)?'done':''}">${x}</span>`).join('');return `<article class="order"><div class="orderhead"><div><div class="orderid">${esc(o.id)} · 创建于 ${fmt(o.created)}</div><h3>${esc(o.person)} 的采购订单</h3></div><span class="status ${cls}">${statuses[o.status]}</span></div><div class="ordergrid"><div class="info"><small>收货信息</small><strong>${esc(o.person)}　${esc(o.phone)}</strong><div class="items">${esc(o.address)}</div></div><div class="info"><small>采购商品</small><div class="items">${items}${o.note?`<br>备注：${esc(o.note)}`:''}</div></div></div><div class="timeline">${timeline}</div>${o.receipt?`<div class="meta"><span>🧾 票据：<b>${esc(o.receipt)}</b> ${o.receiptFile?`· ${esc(o.receiptFile)}`:''}</span></div>`:''}${o.distance?`<div class="meta"><span>🛵 导航距离：<b>${esc(o.distance)} km</b></span>${o.navFile?`<span>路线凭证：<b>${esc(o.navFile)}</b></span>`:''}</div>`:''}${o.events?.length?`<div class="meta">${o.events.map(e=>`<span>✓ ${esc(e.label)} · ${fmt(e.time)}</span>`).join('')}</div>`:''}<div class="actions">${actions}</div></article>`}
function accept(id){let o=orders.find(x=>x.id===id);o.status='accepted';o.events.push({label:'已接单',time:Date.now()});save()}
function finish(id){let o=orders.find(x=>x.id===id);o.status='finished';o.events.push({label:'订单结束',time:Date.now()});save()}
function openStep(id,type){activeId=id;actionType=type;let title,sub,fields;if(type==='receipt'){title='上传采购票据';sub='填写购买明细，并选择票据照片。演示版仅记录文件名。';fields=`<div class="field"><label>票据/采购明细</label><textarea id="receiptText" required placeholder="商品、数量、实付金额等"></textarea></div><div class="field"><label>票据照片</label><input id="receiptFile" type="file" accept="image/*,.pdf"></div>`}else{title='提交配送信息';sub='填写导航应用显示的路程距离，可附上路线截图。';fields=`<div class="field"><label>导航距离（公里）</label><input id="distance" type="number" min="0.1" step="0.1" required placeholder="例如 6.8"></div><div class="field"><label>导航路线截图（选填）</label><input id="navFile" type="file" accept="image/*"></div><div class="help">确认后订单将进入配送中，并记录开始时间。实际地图导航链接后续可接入地图服务。</div>`}document.querySelector('#stepTitle').textContent=title;document.querySelector('#stepSub').textContent=sub;document.querySelector('#stepFields').innerHTML=fields;document.querySelector('#stepModal').classList.add('show')}
document.querySelector('#stepForm').onsubmit=e=>{e.preventDefault();let o=orders.find(x=>x.id===activeId);if(actionType==='receipt'){o.receipt=document.querySelector('#receiptText').value.trim();o.receiptFile=document.querySelector('#receiptFile').files[0]?.name||'';o.status='delivery';o.events.push({label:'已上传票据明细',time:Date.now()},{label:'开始配送',time:Date.now()})}else{o.distance=document.querySelector('#distance').value;o.navFile=document.querySelector('#navFile').files[0]?.name||'';o.status='delivery';o.events.push({label:`开始配送 · 导航 ${o.distance} km`,time:Date.now()})}document.querySelector('#stepModal').classList.remove('show');save()};
// Receipt submission transitions to in-store purchasing complete. The route step is entered separately before delivery begins.
const originalOpenStep=openStep;
// Override receipt action with two-step purchase receipt then route submission.
document.querySelector('#stepForm').onsubmit=e=>{e.preventDefault();let o=orders.find(x=>x.id===activeId);if(actionType==='receipt'){o.receipt=document.querySelector('#receiptText').value.trim();o.receiptFile=document.querySelector('#receiptFile').files[0]?.name||'';o.status='accepted';o.events.push({label:'已上传票据明细',time:Date.now()});o.receiptReady=true}else{o.distance=document.querySelector('#distance').value;o.navFile=document.querySelector('#navFile').files[0]?.name||'';o.status='delivery';o.events.push({label:`开始配送 · 导航 ${o.distance} km`,time:Date.now()})}document.querySelector('#stepModal').classList.remove('show');save()};
function openStep(id,type){activeId=id;actionType=type;let o=orders.find(x=>x.id===id);let title,sub,fields;if(type==='receipt'){title='上传采购票据';sub='记录实际采购明细并选择票据照片；确认后进入配送准备。';fields=`<div class="field"><label>票据/采购明细</label><textarea id="receiptText" required placeholder="商品、数量、实付金额等"></textarea></div><div class="field"><label>票据照片</label><input id="receiptFile" type="file" accept="image/*,.pdf"></div>`}else if(type==='route'){title='开始送货';sub='填写导航应用显示的距离，可附上路线截图。';fields=`<div class="field"><label>导航距离（公里）</label><input id="distance" type="number" min="0.1" step="0.1" required placeholder="例如 6.8"></div><div class="field"><label>导航路线截图（选填）</label><input id="navFile" type="file" accept="image/*"></div><div class="help">提交后订单进入配送中。真实地图导航链接可在后续版本接入地图服务。</div>`}else{title='确认送货到达';sub='确认采购商品已送到收货地址。';fields=`<div class="info"><small>收货地址</small><strong>${esc(o.address)}</strong><div class="items">收货人：${esc(o.person)} · ${esc(o.phone)}</div></div><div class="field"><label>送达备注（选填）</label><textarea id="arrivalNote" placeholder="例如：已交给本人 / 放在门卫处"></textarea></div>`}document.querySelector('#stepTitle').textContent=title;document.querySelector('#stepSub').textContent=sub;document.querySelector('#stepFields').innerHTML=fields;document.querySelector('#stepModal').classList.add('show')}
document.querySelector('#stepForm').onsubmit=e=>{e.preventDefault();let o=orders.find(x=>x.id===activeId);if(actionType==='receipt'){o.receipt=document.querySelector('#receiptText').value.trim();o.receiptFile=document.querySelector('#receiptFile').files[0]?.name||'';o.status='accepted';o.events.push({label:'已上传票据明细',time:Date.now()});o.receiptReady=true}else if(actionType==='route'){o.distance=document.querySelector('#distance').value;o.navFile=document.querySelector('#navFile').files[0]?.name||'';o.status='delivery';o.events.push({label:`开始送货 · 导航 ${o.distance} km`,time:Date.now()})}else{o.arrivalNote=document.querySelector('#arrivalNote').value.trim();o.status='arrived';o.events.push({label:'确认送货到达',time:Date.now()})}document.querySelector('#stepModal').classList.remove('show');save()};
// Purchase receipt leads to a second explicit action to record route distance and start delivery.
function card(o){let cls=o.status==='pending'?'pending':o.status==='finished'?'done':'';let items=o.products.map(p=>`${esc(p.name)} × ${esc(p.qty)} ${esc(p.unit)}`).join('、');let actions='';if(o.status==='pending')actions=`<button class="btn small" onclick="accept('${o.id}')">接单</button>`;if(o.status==='accepted'&&!o.receiptReady)actions=`<button class="btn small" onclick="openStep('${o.id}','receipt')">上传票据明细</button>`;if(o.status==='accepted'&&o.receiptReady)actions=`<button class="btn small" onclick="openStep('${o.id}','route')">开始送货并上传导航距离</button>`;if(o.status==='delivery')actions=`<button class="btn small orange" onclick="openStep('${o.id}','arrived')">确认送货到达</button>`;if(o.status==='arrived')actions=`<button class="btn small" onclick="finish('${o.id}')">结束订单</button>`;let timeline=milestones.map((x,i)=>`${i?'<i></i>':''}<span class="${i<=stage(o.status)?'done':''}">${x}</span>`).join('');return `<article class="order"><div class="orderhead"><div><div class="orderid">${esc(o.id)} · 创建于 ${fmt(o.created)}</div><h3>${esc(o.person)} 的采购订单</h3></div><span class="status ${cls}">${statuses[o.status]}</span></div><div class="ordergrid"><div class="info"><small>收货家属信息</small><strong>${esc(o.person)}　${esc(o.phone)}</strong><div class="items">${esc(o.address)}</div></div><div class="info"><small>采购商品明细</small><div class="items">${items}${o.note?`<br>备注：${esc(o.note)}`:''}</div></div></div><div class="timeline">${timeline}</div>${o.receipt?`<div class="meta"><span>🧾 票据明细：<b>${esc(o.receipt)}</b> ${o.receiptFile?`· ${esc(o.receiptFile)}`:''}</span></div>`:''}${o.distance?`<div class="meta"><span>🛵 导航距离：<b>${esc(o.distance)} km</b></span>${o.navFile?`<span>路线截图：<b>${esc(o.navFile)}</b></span>`:''}</div>`:''}${o.arrivalNote?`<div class="meta"><span>送达备注：<b>${esc(o.arrivalNote)}</b></span></div>`:''}${o.events?.length?`<div class="meta">${o.events.map(e=>`<span>✓ ${esc(e.label)} · ${fmt(e.time)}</span>`).join('')}</div>`:''}<div class="actions">${actions}</div></article>`}
document.querySelector('#newOrder').onclick=()=>{document.querySelector('#createModal').classList.add('show');if(!document.querySelector('#products').children.length)addProduct()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});function addProduct(){let d=document.createElement('div');d.className='productrow';d.innerHTML='<input required placeholder="商品名称" aria-label="商品名称"><input required type="number" min="1" value="1" aria-label="数量"><input required placeholder="单位" aria-label="单位"><button type="button" class="remove" aria-label="删除商品">×</button>';d.querySelector('.remove').onclick=()=>{if(document.querySelectorAll('.productrow').length>1)d.remove()};document.querySelector('#products').appendChild(d)}document.querySelector('#addProduct').onclick=addProduct;
document.querySelector('#createForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),products=[...document.querySelectorAll('.productrow')].map(r=>{let a=r.querySelectorAll('input');return{name:a[0].value.trim(),qty:a[1].value,unit:a[2].value.trim()}});orders.unshift({id:'GTG-'+Date.now().toString().slice(-7),person:f.get('person').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),products,note:f.get('note').trim(),status:'pending',created:Date.now(),events:[]});e.target.reset();document.querySelector('#products').innerHTML='';document.querySelector('#createModal').classList.remove('show');currentFilter='all';document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));save()};document.querySelector('#filters').onclick=e=>{let b=e.target.closest('.filter');if(!b)return;currentFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};render();
</script></body></html>
